<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Subtle gradient for the background panel -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#252a40" />
      <stop offset="100%" stop-color="#13151f" />
    </linearGradient>
  </defs>

  <!-- Dark IDE Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- FITS Data Grid (Faint) -->
  <path d="M 128 128 L 384 128 M 128 256 L 384 256 M 128 384 L 384 384 M 128 128 L 128 384 M 256 128 L 256 384 M 384 128 L 384 384" 
        stroke="#3a3f60" stroke-width="16" fill="none" stroke-linecap="round"/>

  <!-- Glowing Cyan Star (Astronomy/FITS theme) -->
  <path d="M 256 70 C 256 230 230 256 70 256 C 230 256 256 282 256 442 C 256 282 282 256 442 256 C 282 256 256 230 256 70 Z" 
        fill="#7ec8e3"/>
        
  <!-- Bright White Core -->
  <path d="M 256 150 C 256 240 240 256 150 256 C 240 256 256 272 256 362 C 256 272 272 256 362 256 C 272 256 256 240 256 150 Z" 
        fill="#ffffff"/>
</svg>