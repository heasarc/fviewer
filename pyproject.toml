[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "fviewer"
dynamic = ["version"]
description = "A modern, browser-based astronomical FITS file viewer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "requests>=2.33.1",
    "uuid>=1.30",
    "uvicorn>=0.23.0",
    "websockets>=11.0",
]

authors = [
    { name = "Abdu Zoghbi", email = "a.zoghbi@nasa.gov" },
]

[project.scripts]
# This exposes the "fviewer" command line tool
fviewer = "fviewer.cli:main"

[tool.hatch.version]
path = "fviewer/__init__.py"

# Build the front end before packaging
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
]

[tool.hatch.build.targets.wheel]
# Tell the builder to include our Python code and the compiled Vite static files
packages = ["fviewer"]

[tool.hatch.build.targets.sdist]
include = [
    "/fviewer",
    "/frontend",    # Include source so others can build from source distribution
]
exclude = [
    "/.git",
    "/frontend/node_modules",
]
